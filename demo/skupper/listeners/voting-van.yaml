# Consume cross-site voting via Skupper (service voting-van.skupper:8080).
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: voting-van
  namespace: skupper
  labels:
    demo.kcd.ar/plane: skupper
    demo.kcd.ar/service: voting
spec:
  host: voting-van
  port: 8080
  routingKey: voting
  type: tcp
