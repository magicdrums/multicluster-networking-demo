# Project-specific SDD config (generated by sdd-init)
schema: spec-driven

# Persistence: hybrid — openspec files on disk (talk prep) + Engram observations
persistence_mode: hybrid
delivery_strategy: ask-on-risk

context: |
  Project: kcd-argentina2026 — KCD Buenos Aires 2026 talk+demo (multicluster connectivity)
  Tech stack: Greenfield infra-demo (docs + K8s manifests + shell); no app runtime yet
  Architecture: Kuadrant N-S, service mesh E-W (Istio vs Linkerd TBD), Skupper inter-cluster + Podman site; Kind + Podman local
  Testing: No project test runner; Strict TDD disabled until a runner exists
  Style: Not established — empty git repo (master, no commits, no remote)
  Host: Fedora 44 Workstation, ThinkPad P16v Gen1; 16 CPUs, 61 Gi RAM (~48 Gi available), 785G free /home
  Host CLIs: podman 5.8.4, kind v0.32.0, kubectl v1.36.2, helm v3.17.3; missing skupper/istioctl/linkerd
  Note: Kind cluster `kind-cluster` exists (unrelated); fs.inotify.max_user_instances=128; dir owned root:root

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected clusters, CLIs, and demo scripts
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale (especially mesh choice)
  tasks:
    - Group tasks by phase (infra, connectivity, policies, failover demo, docs)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Forecast 400-line PR review budget; delivery_strategy is ask-on-risk
  apply:
    guidelines:
      - Prefer declarative manifests and documented demo scripts over ad-hoc cluster state
      - Do not invent app frameworks; stay docs+manifests+shell unless explore decides otherwise
      - Do not reuse or mutate the pre-existing Kind cluster `kind-cluster` unless explicitly intended
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
